services:
# BEGIN luxdem
  luxdem:
    image: luxdem:latest
    restart: always
    container_name: luxdem
    command: gunicorn app.dash_app:server --workers 4 --worker-class gevent  --bind 0.0.0.0:80
    environment:
      TZ: Europe/Paris
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./config:/app/config
      - ./secrets:/app/secrets
    env_file:
      - ./.env
    labels:
      # Enable Traefik for this specific "backend" service
      - traefik.enable=true
      # Define the port inside of the Docker service to use
      - traefik.http.services.luxdem.loadbalancer.server.port=80
      # Make Traefik use this domain in HTTP
      - traefik.http.routers.luxdem-http.entrypoints=http
      - traefik.http.routers.luxdem-http.rule=Host(`${dash_url}`)
      # Use the traefik-network network (declared below)
      - traefik.docker.network=traefik-network
      # Make Traefik use this domain in HTTPS
      - traefik.http.routers.luxdem-https.entrypoints=https
      - traefik.http.routers.luxdem-https.rule=Host(`${dash_url}`)
      - traefik.http.routers.luxdem-https.tls=true
      # Use the "le" (Let's Encrypt) resolver
      - traefik.http.routers.luxdem-https.tls.certresolver=le
      # https-redirect middleware to redirect HTTP to HTTPS
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true
      # Middleware to redirect HTTP to HTTPS
      - traefik.http.routers.luxdem-http.middlewares=https-redirect
      - traefik.http.routers.luxdem-https.middlewares=secured
    networks:
      - app-network
      # Use the public network created to be shared between Traefik and
      # any other service that needs to be publicly available with HTTPS
      - traefik-network
# END luxdem
# BEGIN luxdem_backend
  luxdem_backend:
    image: luxdem:latest
    restart: always
    container_name: luxdem_backend
    command: gunicorn app.app:app --workers 4 --worker-class gevent  --bind 0.0.0.0:80
    environment:
      TZ: Europe/Paris
    labels:
      # Enable Traefik for this specific "backend" service
      - traefik.enable=true
      # Define the port inside of the Docker service to use
      - traefik.http.services.luxdem-api.loadbalancer.server.port=80
      # Make Traefik use this domain in HTTP
      - traefik.http.routers.luxdem-api-http.entrypoints=http
      - traefik.http.routers.luxdem-api-http.rule=Host(`${fastapi_url}`)
      # Use the traefik-network network (declared below)
      - traefik.docker.network=traefik-network
      # Make Traefik use this domain in HTTPS
      - traefik.http.routers.luxdem-api-https.entrypoints=https
      - traefik.http.routers.luxdem-api-https.rule=Host(`${fastapi_url}`)
      - traefik.http.routers.luxdem-api-https.tls=true
      # Use the "le" (Let's Encrypt) resolver
      - traefik.http.routers.luxdem-api-https.tls.certresolver=le
      # https-redirect middleware to redirect HTTP to HTTPS
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true
      # Middleware to redirect HTTP to HTTPS
      - traefik.http.routers.luxdem-api-http.middlewares=https-redirect
      - traefik.http.routers.luxdem-api-https.middlewares=secured
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./config:/app/config
      - ./secrets:/app/secrets
    env_file:
      - ./.env
    networks:
      - app-network
      # Use the public network created to be shared between Traefik and
      # any other service that needs to be publicly available with HTTPS
      - traefik-network
# END luxdem_backend
# NETWORKS
networks:
  app-network:
   name: ${app_network:-app-network}
   external: true
  traefik-network:
    external: true
