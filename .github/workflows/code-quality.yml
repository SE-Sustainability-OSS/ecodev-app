name: pipeline

on:
  push:
    paths-ignore:
      - 'badges/**'

jobs:
  test:
    name: code quality
    runs-on: ubuntu-latest
    env:
      GITHUB-ACTION: true
    services:
      postgres:
        image: postgres:14.2-alpine
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -e POSTGRES_PASSWORD=postgres
          -e POSTGRES_DB=postgres
          -e POSTGRES_USER=postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v3

      - name: Build the Docker image
        run: |
          docker build . --file Dockerfile --tag ecodev_app:latest

      - name: Test with UnitTest
        uses: addnab/docker-run-action@v3
        env:
          POSTGRES_HOST: postgres
        with:
          image: ecodev_app:latest
          options:
            -e algorithm=HS256
            -e access_token_expire_minutes=1440
            -e admin_user=postgres
            -e db_username=postgres
            -e db_password=postgres
            -e app_username=postgres
            -e app_password=postgres
            -e db_host=postgres
            -e db_name=postgres
            -e db_port=${{ job.services.postgres.ports[5432] }}
            -e test_password=postgres
            -e hashed_admin_password=$2b$12$NIgWF4eEAFZGXfNw7IN1f.JH0zESPVSdQ.nEUcOLhp/rQmo6y9l5e
            -e secret_key=totototototototototototototototototototo
            -v ${{github.workspace}}/tests:/app/tests
            -v ${{github.workspace}}/app:/app/app
            -v ${{github.workspace}}:/app/
            -v ${{github.workspace}}/.coveragerc:/app/.coveragerc
          run: |
            python3 -m unittest discover | exit 1
            coverage html 
            coverage report -m  --fail-under=60 --precision=2 > coverage.log
            cat coverage.log
            COVERAGE_SCORE=$(sed -n 's/^\(TOTAL\s*[0-9]*\s*[0-9]*\s*\)//p' coverage.log)
            anybadge --label=coverage --value=$COVERAGE_SCORE --file=coverage.svg 50=red 60=orange 80=yellow 100=green
            echo "Coverage score is $COVERAGE_SCORE"
            mv coverage.svg ./badges/


      - name: Commit badge files
        if: ${{ github.ref }} != main
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          date > badges/date.log
          git add badges/coverage.svg
          git add badges/pylint.svg
          git add badges/date.log
          git commit -m "Add badges" -n

      - name: Push badge files
        if: ${{ github.ref }} != main
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{github.workspace}}/htmlcov

      - name: build front end stack
        run: docker compose -f docker-compose-test.yml up -d

      - name: install selenium
        run: docker exec seed pip install selenium

      - name:
        run: |
          docker rename $(docker ps --format '{{.Names}}' | grep elast) es-db
          docker rename $(docker ps --format '{{.Names}}' grep post ) postgres
          docker network connect test postgres
          docker network connect test es-db


      - name: run frontend test
        run: docker exec seed python3 tests_frontend/test_selenium.py

      
      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15